<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Órdenes - Mantenimiento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <!-- BARRA SUPERIOR -->
    <nav class="bg-blue-700 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fas fa-tools"></i> Mantenimiento - Órdenes FE
        </h1>
        <div id="usuario-status" class="text-sm bg-blue-800 px-3 py-1 rounded-full font-semibold">
            Modo: Mantenimiento
        </div>
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="max-w-4xl mx-auto m-6 p-6 bg-white rounded-xl shadow-md">
        
        <!-- SECCIÓN DE AJUSTES GENERALES -->
        <div class="border-b pb-4 mb-6">
            <h2 class="text-lg font-bold text-gray-800 mb-2">⚙️ Ajustes Generales y Configuración</h2>
            <p class="text-sm text-gray-600 mb-4">Administra las máquinas, operarios y contraseñas del sistema.</p>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- AGREGAR MÁQUINA -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <h3 class="font-semibold text-gray-700 mb-2">Añadir Máquina</h3>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="nuevaMaquinaInput" placeholder="Ej: Torno CNC" class="flex-1 p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="agregarMaquinaLista()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-bold transition">Guardar</button>
                    </div>
                    <div id="lista-maquinas-config" class="max-h-32 overflow-y-auto border p-2 rounded bg-white">
                        <span class="text-xs text-gray-400">Cargando máquinas...</span>
                    </div>
                </div>

                <!-- AGREGAR OPERARIO -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <h3 class="font-semibold text-gray-700 mb-2">Añadir Operario</h3>
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="nuevoOperarioInput" placeholder="Ej: Juan Pérez" class="flex-1 p-2 border rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <button onclick="agregarOperarioLista()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm font-bold transition">Guardar</button>
                    </div>
                    <div id="lista-operarios-config" class="max-h-32 overflow-y-auto border p-2 rounded bg-white">
                        <span class="text-xs text-gray-400">Cargando operarios...</span>
                    </div>
                </div>
            </div>

            <!-- CONTRASEÑAS -->
            <div class="mt-6 bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h3 class="font-semibold text-gray-700 mb-3">Contraseñas de Acceso</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Jefe:</label>
                        <input type="password" id="conf_pass_jefe" class="w-full p-2 border rounded text-sm" placeholder="Pass Jefe">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Supervisor:</label>
                        <input type="password" id="conf_pass_sup" class="w-full p-2 border rounded text-sm" placeholder="Pass Supervisor">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-600 mb-1">Taller:</label>
                        <input type="password" id="conf_pass_taller" class="w-full p-2 border rounded text-sm" placeholder="Pass Taller">
                    </div>
                </div>
                <button onclick="guardarCredenciales()" class="mt-4 bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded text-sm font-bold w-full transition">
                    Actualizar Contraseñas
                </button>
            </div>
        </div>
    </div>

    <!-- NOTIFICACIONES TOAST -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-4 py-2 rounded shadow-lg hidden transition">
        Mensaje
    </div>

    <!-- FIREBASE SDK MODULAR -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CONFIGURACIÓN DE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAernP0Ggb3yUn7aUJwdhN6AUuqLXg0R6k",
            authDomain: "ordenes-fe.firebaseapp.com",
            projectId: "ordenes-fe",
            storageBucket: "ordenes-fe.firebasestorage.app",
            messagingSenderId: "98577406074",
            appId: "1:98577406074:web:1578c910f529252052c3c3",
            measurementId: "G-71B24C0M0K"
        };

        // INICIALIZACIÓN
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // EXPORTAR A WINDOW PARA USO GLOBAL
        window.db = db;
        window.fb = { collection, getDocs, doc, setDoc };

        // CARGAR DATOS AL INICIAR
        window.addEventListener('DOMContentLoaded', () => {
            cargarConfiguracionUI();
        });
    </script>

    <!-- SCRIPT DE LÓGICA DE APLICACIÓN -->
    <script>
        function mostrarToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        async function cargarConfiguracionUI() {
            try {
                const { getDocs, collection } = window.fb;
                const snap = await getDocs(collection(window.db, "configuracion"));
                let listas = { operarios: [], maquinas: [] };
                let creds = {};

                snap.forEach(d => {
                    if (d.id === "listas") listas = d.data();
                    if (d.id === "credenciales") creds = d.data();
                });

                document.getElementById('conf_pass_jefe').value = creds.jefe || "jefe123";
                document.getElementById('conf_pass_sup').value = creds.supervisor || "sup123";
                document.getElementById('conf_pass_taller').value = creds.taller || "taller123";

                const maquinasHTML = (listas.maquinas || []).length > 0 
                    ? listas.maquinas.map(m => `<div class="text-xs bg-gray-100 p-1.5 rounded border mb-1 font-medium text-gray-700">${m}</div>`).join('')
                    : '<span class="text-xs text-gray-400">Sin máquinas registradas</span>';
                
                document.getElementById('lista-maquinas-config').innerHTML = maquinasHTML;

                const operariosHTML = (listas.operarios || []).length > 0 
                    ? listas.operarios.map(op => `<div class="text-xs bg-gray-100 p-1.5 rounded border mb-1 font-medium text-gray-700">${op}</div>`).join('')
                    : '<span class="text-xs text-gray-400">Sin operarios registrados</span>';

                document.getElementById('lista-operarios-config').innerHTML = operariosHTML;
            } catch (e) {
                console.error("Error al cargar configuración:", e);
                mostrarToast('Error de conexión con la base de datos');
            }
        }

        async function agregarMaquinaLista() {
            const input = document.getElementById('nuevaMaquinaInput');
            const val = input.value.trim();
            if (!val) return;

            try {
                const { getDocs, doc, setDoc, collection } = window.fb;
                const snap = await getDocs(collection(window.db, "configuracion"));
                let listas = { operarios: [], maquinas: [] };
                
                snap.forEach(d => { if(d.id === "listas") listas = d.data(); });
                if (!listas.maquinas) listas.maquinas = [];
                
                listas.maquinas.push(val);

                await setDoc(doc(window.db, "configuracion", "listas"), listas);
                input.value = "";
                await cargarConfiguracionUI();
                mostrarToast('Máquina guardada con éxito');
            } catch (e) {
                console.error(e);
                mostrarToast('Error al guardar la máquina');
            }
        }

        async function agregarOperarioLista() {
            const input = document.getElementById('nuevoOperarioInput');
            const val = input.value.trim();
            if (!val) return;

            try {
                const { getDocs, doc, setDoc, collection } = window.fb;
                const snap = await getDocs(collection(window.db, "configuracion"));
                let listas = { operarios: [], maquinas: [] };
                
                snap.forEach(d => { if(d.id === "listas") listas = d.data(); });
                if (!listas.operarios) listas.operarios = [];
                
                listas.operarios.push(val);

                await setDoc(doc(window.db, "configuracion", "listas"), listas);
                input.value = "";
                await cargarConfiguracionUI();
                mostrarToast('Operario guardado con éxito');
            } catch (e) {
                console.error(e);
                mostrarToast('Error al guardar el operario');
            }
        }

        async function guardarCredenciales() {
            const jefe = document.getElementById('conf_pass_jefe').value;
            const supervisor = document.getElementById('conf_pass_sup').value;
            const taller = document.getElementById('conf_pass_taller').value;

            try {
                const { doc, setDoc } = window.fb;
                await setDoc(doc(window.db, "configuracion", "credenciales"), {
                    jefe: jefe,
                    supervisor: supervisor,
                    taller: taller
                });
                mostrarToast('Contraseñas actualizadas');
            } catch (e) {
                console.error(e);
                mostrarToast('Error al actualizar las contraseñas');
            }
        }
    </script>
</body>
</html>
